name: Continuous Integration

on:
  push:
    branches:
      - main
      - hardening
  pull_request:
    branches:
      - main

jobs:
  flutter_checks:
    name: Flutter Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Report Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static code analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run automated tests
        run: flutter test --coverage

  functions_and_security:
    name: Cloud Functions & Firebase Security Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Set up Java for Firebase Emulators
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Pinned Firebase Tools CLI
        run: npm install -g firebase-tools@15.2.1

      - name: Verify Pinned Firebase Tools CLI Version
        run: |
          CLI_VERSION=$(firebase --version)
          echo "Verified Firebase CLI version: $CLI_VERSION"
          if [ "$CLI_VERSION" != "15.2.1" ]; then
            echo "ERROR: Expected firebase-tools@15.2.1 but found $CLI_VERSION"
            exit 1
          fi

      - name: Install Functions dependencies
        working-directory: ./functions
        run: npm ci

      - name: Lint Cloud Functions
        working-directory: ./functions
        run: npm run lint

      - name: Build TypeScript Cloud Functions
        working-directory: ./functions
        run: npm run build

      - name: Run Functions Production-Helper Unit Tests
        working-directory: ./functions
        run: npm test

      - name: Run Staging Secret Contract & Identity Tests
        working-directory: ./functions
        run: npm run test:staging:contract

      - name: Run Fastlane Staging Distribution Guard Ruby Tests
        run: ruby test/infrastructure/test_staging_distribution_guard.rb

      - name: Run iOS Firebase Plist Selector POSIX Portability Tests
        run: sh test/infrastructure/test_plist_selector.sh

      - name: Run Firebase Security Rules against Live Emulators
        working-directory: ./functions
        run: firebase emulators:exec --project chat-app-28ac0 --only "firestore,storage,database" "npm run test:rules"
